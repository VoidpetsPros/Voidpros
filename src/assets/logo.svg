<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- flat background -->
  <rect width="512" height="512" rx="96" fill="#1a1025"/>

  <!-- faceted crystal cluster, flat 2D, no gradients/shadows -->
  <g>
    <!-- back-left facet -->
    <polygon points="150,260 190,175 245,205 235,290" fill="#6d28d9"/>
    <!-- back-right facet -->
    <polygon points="330,250 300,170 360,195 375,275" fill="#5b21b6"/>
    <!-- top-left peak -->
    <polygon points="190,175 245,205 235,150 205,140" fill="#8b5cf6"/>
    <!-- top-right peak -->
    <polygon points="300,170 360,195 340,140 310,135" fill="#7c3aed"/>
    <!-- center-top facet -->
    <polygon points="245,205 300,170 310,135 260,120 215,150" fill="#a78bfa"/>
    <!-- center main facet -->
    <polygon points="235,290 245,205 300,170 330,250 300,330 260,345" fill="#9061e8"/>
    <!-- left lower facet -->
    <polygon points="150,260 235,290 260,345 195,360 160,320" fill="#7c3aed"/>
    <!-- right lower facet -->
    <polygon points="330,250 375,275 350,335 300,330" fill="#6d28d9"/>
    <!-- bottom center facet -->
    <polygon points="260,345 300,330 350,335 320,380 250,390 195,360" fill="#5b21b6"/>
    <!-- small bright accent facet -->
    <polygon points="245,205 260,120 215,150 235,290" fill="#c4b5fd"/>
  </g>
</svg>
